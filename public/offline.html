<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Cooky</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f1;
        --fg: #1d1b16;
        --muted: #6b665c;
        --card: #ffffff;
        --line: #e4e0d6;
        --accent: #b77800;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141412;
          --fg: #f1efe8;
          --muted: #a8a397;
          --card: #1d1c19;
          --line: #34322d;
          --accent: #f0b23a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        font-size: 1.9rem;
        margin: 0 0 0.5rem;
      }
      h2 {
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 1.5rem 0 0.5rem;
      }
      .banner {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 0.75rem 1rem;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
      }
      li + li {
        border-top: 1px solid var(--line);
      }
      label {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        min-height: 3.5rem;
        padding: 0 1rem;
        cursor: pointer;
      }
      input[type="checkbox"] {
        width: 1.25rem;
        height: 1.25rem;
        accent-color: var(--accent);
        flex: none;
      }
      .done {
        text-decoration: line-through;
        color: var(--muted);
      }
      .amount {
        font-weight: 600;
      }
      ol {
        padding-inline-start: 1.25rem;
      }
      ol li,
      .plain li {
        padding: 0.5rem 0;
        border: 0;
      }
      .plain {
        background: none;
        border: 0;
        padding-inline-start: 1.25rem;
        list-style: disc;
      }
      button {
        margin-top: 1.5rem;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      p.progress {
        font-weight: 600;
        margin: 1rem 0 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="/offline.js"></script>
  </body>
</html>
